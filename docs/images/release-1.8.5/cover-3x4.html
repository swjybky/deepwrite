<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>DeepWrite 1.8.5 封面</title>
<style>
:root {
  --paper: #f5f2ea;
  --ink: #1f3a2e;
  --quiet: #5f6b62;
  --sage: #b9cbb3;
  --sage-soft: #dbe5d5;
  --leaf: #54745c;
  --orange: #c4612f;
  --white: #fffdf7;
  --line: #d9dccf;
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow: hidden; background: var(--paper); color: var(--ink); }
body {
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  position: relative;
}
.num { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; }
.heavy { font-weight: 600; -webkit-text-stroke: 0.035em currentColor; paint-order: stroke fill; }
.brand { display: flex; align-items: center; }
.brand img { display: block; }
.brand .name { font-family: -apple-system, "SF Pro Display", sans-serif; font-weight: 800; letter-spacing: -0.03em; }
.chip {
  display: inline-flex; align-items: center;
  border: 3px solid var(--orange); color: var(--orange);
  border-radius: 999px; font-weight: 600; letter-spacing: 0.04em;
}
.version { font-weight: 900; letter-spacing: -0.045em; line-height: 0.86; position: relative; }
.swash {
  position: absolute; left: -2%; right: -4%; height: 0.11em; bottom: -0.02em;
  background: var(--sage); border-radius: 999px; transform: rotate(-2deg); z-index: -1; opacity: 0.85;
}
.pill { background: var(--sage-soft); border-radius: 36px; position: relative; }
.pill .accent { position: absolute; }
.pill .accent i { position: absolute; display: block; background: var(--orange); border-radius: 4px; }
.feature {
  display: inline-flex; align-items: center; background: var(--white);
  border: 3px solid var(--ink); border-radius: 22px; font-weight: 600; white-space: nowrap;
  box-shadow: 0 10px 0 -2px var(--ink);
}
.feature svg { flex-shrink: 0; }
.card {
  position: absolute; background: var(--white); border-radius: 22px;
  box-shadow: 0 24px 50px -24px rgba(31, 58, 46, 0.45);
  border: 2px solid #e6e4da;
}
.card.front { border: 5px solid var(--leaf); }
.card .label { font-weight: 600; color: var(--ink); }
.card .bar { display: block; height: 10px; border-radius: 6px; background: #d9dfd2; margin-top: 16px; }
.card .bar.short { width: 62%; }
.card .bar.title { width: 45%; height: 14px; background: #b7c6b1; margin-top: 0; }
.pic {
  position: relative; overflow: hidden; border-radius: 12px; margin-top: 18px;
  background: linear-gradient(170deg, #e3eadf, #b7c9b7 55%, #8eaa93);
}
.pic::before { content: ""; position: absolute; right: 18%; top: 16%; width: 18%; aspect-ratio: 1; border-radius: 50%; background: #f3e1c1; }
.pic::after { content: ""; position: absolute; left: -15%; right: 22%; bottom: -55%; height: 95%; border-radius: 50%; background: rgba(84, 116, 92, 0.85); }
.spark { position: absolute; color: var(--orange); font-weight: 700; line-height: 1; }
.versions { position: absolute; display: flex; align-items: center; }
.versions span {
  display: inline-grid; place-items: center; border-radius: 12px; font-weight: 700;
  background: var(--white); border: 3px solid var(--line); color: var(--quiet);
}
.versions span.now { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.versions i { display: block; height: 3px; background: var(--line); }
.versions b { font-weight: 600; color: var(--quiet); white-space: nowrap; }

html, body { width: 1440px; height: 1920px; }
</style></head><body>
