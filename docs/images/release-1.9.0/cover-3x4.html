<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DeepWrite 1.9.0 封面 3:4</title>
    <style>
      :root {
        --bg: #f4f2eb;
        --ink: #1f3a2f;
        --quiet: #5d6a61;
        --sage: #c9d7bc;
        --sage-deep: #8fa981;
        --orange: #c8602c;
        --card: #fffdf7;
      }
      html,
      body {
        width: 1440px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        position: relative;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      .latin {
        font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
      }
      .heavy {
        font-weight: 600;
        -webkit-text-stroke: var(--stroke, 3px) currentColor;
        paint-order: stroke fill;
      }
      .abs {
        position: absolute;
      }
      .blob {
        border-radius: 50%;
        background: var(--sage);
        opacity: 0.42;
      }
      .ring {
        border-radius: 50%;
        border: 36px solid var(--sage);
        opacity: 0.4;
      }
      .dots {
        background-image: radial-gradient(var(--sage-deep) 2.4px, transparent 2.6px);
        background-size: 28px 28px;
        opacity: 0.35;
      }

      .brand {
        left: 110px;
        top: 108px;
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .brand img {
        width: 88px;
        height: 88px;
        border-radius: 20px;
      }
      .brand .name {
        font-size: 78px;
        font-weight: 800;
        letter-spacing: -1.8px;
        line-height: 1;
      }
      .open-tag {
        margin-left: 6px;
        padding: 8px 22px 10px;
        border-radius: 999px;
        background: var(--orange);
        color: #fff8ee;
        font-size: 34px;
        --stroke: 0.6px;
      }
      .release-tag {
        left: 104px;
        top: 262px;
        padding: 14px 40px 18px;
        border-radius: 22px;
        background: var(--orange);
        color: #fff8ee;
        font-size: 66px;
        letter-spacing: 1px;
        --stroke: 2px;
        transform: skewX(-8deg);
      }
      .release-tag span {
        display: inline-block;
        transform: skewX(8deg);
      }
      .burst {
        left: 860px;
        top: 228px;
        width: 70px;
        height: 70px;
      }
      .latest {
        left: 1030px;
        top: 432px;
        padding: 8px 24px 10px;
        border-radius: 14px;
        border: 3px solid var(--orange);
        color: var(--orange);
        font-size: 40px;
        --stroke: 0.9px;
        transform: rotate(-6deg);
      }
      .version {
        left: 96px;
        top: 392px;
        font-size: 330px;
        font-weight: 800;
        letter-spacing: -14px;
        line-height: 1;
        --stroke: 4px;
      }
      .bars {
        left: 110px;
        top: 764px;
        display: flex;
        gap: 16px;
      }
      .bars i {
        height: 12px;
        width: 200px;
        border-radius: 12px;
        background: var(--sage-deep);
      }
      .bars i + i {
        width: 70px;
        background: var(--orange);
      }
      .headline {
        left: 110px;
        top: 816px;
        margin: 0;
        font-size: 118px;
        line-height: 1.16;
        letter-spacing: -1px;
        --stroke: 4px;
      }
      .launch {
        left: 110px;
        top: 1108px;
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .launch svg {
        width: 58px;
        height: 58px;
      }
      .launch b {
        color: var(--orange);
        font-size: 92px;
        --stroke: 3px;
      }
      .launch span {
        color: var(--quiet);
        font-size: 44px;
        font-weight: 600;
        padding-top: 16px;
      }

      .card {
        width: 300px;
        height: 330px;
        padding: 28px 28px 0;
        box-sizing: border-box;
        border-radius: 26px;
        background: var(--card);
        border: 4px solid var(--sage-deep);
        box-shadow: 0 22px 44px rgba(31, 58, 47, 0.14);
      }
      .card .label {
        display: inline-block;
        padding: 6px 18px 8px;
        border-radius: 999px;
        background: var(--sage);
        font-size: 30px;
        font-weight: 600;
      }
      .card .line {
        display: block;
        height: 12px;
        margin-top: 20px;
        border-radius: 12px;
        background: #cfd8c6;
      }
      .card .line.short {
        width: 62%;
      }
      .cite {
        display: flex;
        gap: 12px;
        margin-top: 20px;
      }
      .cite span {
        padding: 4px 12px 6px;
        border-radius: 9px;
        background: #f6e3d6;
        color: var(--orange);
        font-size: 24px;
        font-weight: 700;
        font-family: "Avenir Next", Arial, sans-serif;
      }
      .academic {
        left: 330px;
        top: 1262px;
        transform: rotate(-6deg);
      }
      .mystery {
        left: 690px;
        top: 1240px;
        transform: rotate(5deg);
        border-color: var(--ink);
      }
      .mystery .label {
        background: var(--ink);
        color: #f6f3ea;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 24px;
      }
      .grid i {
        height: 52px;
        border-radius: 10px;
        background: #e3e9da;
      }
      .grid i.hot {
        background: #f3d3bf;
        border: 3px solid var(--orange);
        box-sizing: border-box;
      }
      .keyhole {
        display: block;
        margin: 20px auto 0;
        width: 46px;
        height: 58px;
      }
      .arc {
        left: 250px;
        top: 1206px;
        width: 940px;
        height: 420px;
      }
      .spark {
        left: 1014px;
        top: 1196px;
        width: 64px;
        height: 64px;
      }

      .chips {
        left: 110px;
        top: 1648px;
        display: flex;
        gap: 18px;
      }
      .chips span {
        padding: 12px 26px 14px;
        border: 3px solid var(--sage-deep);
        border-radius: 18px;
        background: var(--card);
        font-size: 40px;
        font-weight: 600;
        white-space: nowrap;
      }
      .cta {
        left: 110px;
        top: 1762px;
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 20px 44px 24px;
        border-radius: 24px;
        background: var(--ink);
        color: #f6f3ea;
        font-size: 54px;
        --stroke: 1.4px;
      }
      .cta i {
        width: 12px;
        height: 52px;
        border-radius: 4px;
        background: var(--orange);
        transform: skewX(-18deg);
      }
    </style>
  </head>
