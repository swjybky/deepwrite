<svg xmlns="http://www.w3.org/2000/svg" fill="#2C2C2A" width="1000" height="970" viewBox="0 0 1000 970" role="img">
  <title>界面线框：转换结果与再次转换的冲突处理</title>
  <desc>再次转换后的结果页：汇总各状态条目数；需要处理区列出冲突条目（保留我的修改或用新内容覆盖）和来源已删除条目（勾选后经确认删除）；仿写增强卡片显示生成状态与用量；下一步提供打开素材分组、关联到作品、以此新建仿写长篇；条目一览按库分组并可打开到素材库。</desc>
  <defs>
    <style>
