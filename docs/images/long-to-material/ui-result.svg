      .warn { font-size: 12px; fill: #854F0B; font-weight: 600; }
      .ok { font-size: 12px; fill: #0F6E56; font-weight: 600; }
      .new { font-size: 11.5px; fill: #0C447C; font-weight: 600; }
      .idx { font-size: 13px; fill: #0C447C; }
