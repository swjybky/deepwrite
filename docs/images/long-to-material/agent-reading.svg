<svg xmlns="http://www.w3.org/2000/svg" fill="#2C2C2A" width="1000" height="620" viewBox="0 0 1000 620" role="img">
  <title>主智能体如何读取：首屏目录按库配额</title>
  <desc>上半部分对比首屏 64 条素材目录：现状按类型顺序排列，人设和剧情占满首屏，正文和其他库（世界观）不可见；改后每个库先取配额 K 条（5 个库时 K 为 12），五个库的首条索引都进入首屏，其余条目按原顺序补足。下半部分是主智能体的读取路线：首屏目录、读取全书导读、按创作阶段读取条目、用 search 兜底定位。</desc>
