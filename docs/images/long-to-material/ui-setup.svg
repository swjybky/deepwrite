<svg xmlns="http://www.w3.org/2000/svg" fill="#2C2C2A" width="1000" height="1136" viewBox="0 0 1000 1136" role="img">
  <title>界面线框：长篇转素材库开始前设置与条目预览</title>
  <desc>长篇转素材库页面：来源长篇选择与规模，七项转换内容勾选和人物范围、章纲粒度、范文章节设置，写入目标（新建分组或更新已有转换），可选的仿写增强（模型、档案、预估与外发提示），按库汇总的条目预览，底部为预览条目和开始转换按钮。</desc>
  <defs>
    <style>
      svg { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif; }
      .side { font-size: 13px; fill: #444441; }
      .side-h { font-size: 12px; fill: #888780; }
      .side-active { font-size: 13px; font-weight: 600; fill: #2C2C2A; }
      .eyebrow { font-size: 12px; fill: #888780; }
      .h1 { font-size: 22px; font-weight: 600; }
      .desc { font-size: 13px; fill: #5F5E5A; }
      .ct { font-size: 14px; font-weight: 600; }
      .body { font-size: 13px; }
      .muted { font-size: 12.5px; fill: #5F5E5A; }
      .faint { font-size: 12.5px; fill: #A8A69E; }
      .small { font-size: 12px; fill: #5F5E5A; }
      .th { font-size: 12px; fill: #888780; }
      .link { font-size: 12.5px; fill: #185FA5; }
      .btn { font-size: 13px; }
      .btn-p { font-size: 13px; fill: #FFFFFF; font-weight: 600; }
      .ok { font-size: 12px; fill: #0F6E56; font-weight: 600; }
      .note { font-size: 12px; fill: #854F0B; }
      .idx { font-size: 12.5px; fill: #0C447C; }
      .chip { font-size: 12px; fill: #444441; }
    </style>
  </defs>
  <rect width="1000" height="1136" fill="#FFFFFF"/>
  <rect x="20" y="20" width="960" height="1096" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
