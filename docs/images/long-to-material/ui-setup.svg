  <rect x="250" y="304" width="690" height="236" rx="10" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text class="ct" x="270" y="330">转换内容</text>
  <text class="link" x="920" y="330" text-anchor="end">全选</text>
