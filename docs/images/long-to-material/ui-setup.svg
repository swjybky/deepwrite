  <path d="M668 217 L674 223 L680 217" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="706" y="208" width="190" height="26" rx="13" fill="#E1F5EE"/>
  <text class="ok" x="801" y="225" text-anchor="middle">来自整书拆解 · 已完成</text>
  <g fill="#F1EFE8">
    <rect x="270" y="250" width="132" height="26" rx="13"/>
    <rect x="410" y="250" width="70" height="26" rx="13"/>
    <rect x="488" y="250" width="200" height="26" rx="13"/>
    <rect x="696" y="250" width="80" height="26" rx="13"/>
