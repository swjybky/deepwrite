  </g>
  <text class="chip" x="336" y="267" text-anchor="middle">世界观 7 类 132 条</text>
  <text class="chip" x="445" y="267" text-anchor="middle">人物 86</text>
  <text class="chip" x="588" y="267" text-anchor="middle">6 卷 · 48 剧情点 · 1,024 章卡</text>
  <text class="chip" x="736" y="267" text-anchor="middle">伏笔线 24</text>
  <text class="chip" x="850" y="267" text-anchor="middle">已写正文 1,024 章</text>

