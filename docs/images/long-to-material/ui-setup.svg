  <text class="link" x="688" y="524">＋ 添加章节（最多 20）</text>

  <g transform="translate(0 16)">
  <!-- card 3: target -->
  <rect x="250" y="538" width="690" height="112" rx="10" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text class="ct" x="270" y="564">写入目标</text>
  <circle cx="277" cy="590" r="7" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.5"/>
