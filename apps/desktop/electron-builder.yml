appId: cn.deepwrite.desktop
productName: DeepWrite
artifactName: "${productName}-${version}-${os}-${arch}-test.${ext}"

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true
beforeBuild: ./scripts/electron-builder-before-build.cjs

extraMetadata:
  homepage: https://github.com/swjybky/deepwrite
  desktopName: DeepWrite

publish:
  provider: generic
  url: https://github.com/swjybky/deepwrite/releases/latest/download
  channel: latest

mac:
  target:
    - dmg
    - zip
  icon: build/icon.png
  category: public.app-category.productivity
  identity: "-"
  hardenedRuntime: false
  notarize: false
  extendInfo:
    NSMicrophoneUsageDescription: DeepWrite 使用麦克风录制语音，并通过您配置的语音服务转换为文字。

win:
  target: nsis
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  forceCodeSigning: false

linux:
  target:
    - AppImage
    - deb
    - pacman
  icon: build/icon.png
  category: Office
  executableName: deepwrite
  maintainer: carswj <wenjia@wenjiadeMacBook-Air.local>
  vendor: DeepWrite
  syncDesktopName: true

# Keep Arch dependencies separate from Debian package names and bundled codecs.
pacman:
  packageName: deepwrite
  artifactName: "${productName}-${version}-${os}-${arch}-test.pkg.tar.xz"
  compression: xz
  depends:
    - alsa-lib
    - at-spi2-core
    - cairo
    - dbus
    - expat
    - glib2
    - glibc
    - gtk3
    - libcups
    - libdrm
    - libgcc
    - libsecret
    - libx11
    - libxcb
    - libxcomposite
    - libxdamage
    - libxext
    - libxfixes
    - libxkbcommon
    - libxrandr
    - mesa
    - nspr
    - nss
    - pango
    - systemd-libs
    - libnotify
    - libayatana-appindicator
    - xdg-utils

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DeepWrite
  deleteAppDataOnUninstall: false
