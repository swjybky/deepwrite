name: Build and publish tagged release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      reuse_run_id:
        description: Reuse verified installers from an earlier run (optional)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Validate tag and source version
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      reuse_run_id: ${{ steps.recovery.outputs.run_id }}
    steps:
      - name: Check out released source
        id: source
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate release tag and both package versions
        run: node tools/release-version.mjs

      - name: Validate private release configuration before packaging
        if: ${{ inputs.reuse_run_id == '' }}
        env:
          DEEPWRITE_RELEASE_ENV: ${{ secrets.DEEPWRITE_RELEASE_ENV }}
        run: node tools/release-environment.mjs check-secret

      - name: Record released source for recovery
        if: ${{ inputs.reuse_run_id == '' }}
        run: git rev-parse HEAD > release-source.txt

      - name: Keep released source for recovery
        id: source_record
        if: ${{ inputs.reuse_run_id == '' }}
        uses: actions/upload-artifact@v6
        with:
          name: release-source-configured-${{ steps.source.outputs.commit }}
          path: release-source.txt
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Validate reusable installers
        id: recovery
        if: ${{ inputs.reuse_run_id != '' }}
        uses: actions/github-script@v8
        env:
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        with:
          script: |
            const value = process.env.REUSE_RUN_ID;
            const runId = Number(value);
            if (!/^[1-9]\d*$/u.test(value) || !Number.isSafeInteger(runId)) {
              throw new Error('Invalid installer run ID.');
            }
            const options = { ...context.repo, run_id: runId };
            const { data: run } = await github.rest.actions.getWorkflowRun(options);
            if (run.path !== '.github/workflows/release.yml' ||
                run.status !== 'completed' ||
                !['push', 'workflow_dispatch'].includes(run.event)) {
              throw new Error('Installer run does not match the released source.');
            }
            const platforms = ['win-x64', 'mac-arm64', 'mac-x64', 'linux-x64'];
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...options, filter: 'latest', per_page: 100
            });
            for (const platform of platforms) {
              const matches = jobs.filter(job => job.name === `Package ${platform}`);
              if (matches.length !== 1 || matches[0].status !== 'completed' ||
                  matches[0].conclusion !== 'success') {
                throw new Error(`Installer verification did not pass: ${platform}`);
              }
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { ...options, per_page: 100 });
            // checkout pins the installer source; a manual run's head_sha is its workflow revision.
            const sources = artifacts.filter(artifact => artifact.name.startsWith('release-source-'));
            if (sources.length !== 1 ||
                sources[0].name !== `release-source-configured-${process.env.RELEASE_COMMIT}` ||
                sources[0].expired || sources[0].size_in_bytes <= 0) {
              throw new Error('Installer source record does not match the released source or is expired; verified release configuration is required.');
            }
            const installers = artifacts.filter(artifact => artifact.name.startsWith('installers-'));
            if (installers.length !== platforms.length || platforms.some(platform => {
              const matches = installers.filter(artifact => artifact.name === `installers-${platform}`);
              return matches.length !== 1 || matches[0].expired || matches[0].size_in_bytes <= 0;
            })) {
              throw new Error('Verified installer artifacts are incomplete or expired.');
            }
            core.setOutput('run_id', String(runId));

  package:
    name: Package ${{ matrix.id }}
    needs: prepare
    if: ${{ !needs.prepare.outputs.reuse_run_id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: win-x64
            os: windows-2025
            script: pack:test:win
            workers: 4
            heap: 6144
          - id: mac-arm64
            os: macos-15
            script: pack:test:mac:arm64
            workers: 3
            heap: 4096
          - id: mac-x64
            os: macos-15-intel
            script: pack:test:mac:x64
            workers: 4
            heap: 6144
          - id: linux-x64
            os: ubuntu-24.04
            script: pack:test:linux
            workers: 4
            heap: 6144
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      DEEPWRITE_TEST_MAX_WORKERS: ${{ matrix.workers }}
      NODE_OPTIONS: --max-old-space-size=${{ matrix.heap }}
      DEEPWRITE_REQUIRE_RELEASE_CONFIG: "1"
    steps:
      - name: Preserve LF source files on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out validated release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pnpm and cache dependencies
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          cache: true
          cache_dependency_path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore private build configuration
        env:
          DEEPWRITE_RELEASE_ENV: ${{ secrets.DEEPWRITE_RELEASE_ENV }}
        run: node tools/release-environment.mjs restore-secret

      - name: Prepare Linux desktop verification
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            xvfb dbus-x11 libgtk-3-0t64 libnotify4 libnss3 libxss1 \
            libasound2t64 libsecret-1-0 libgbm1 libxtst6 libatspi2.0-0t64 \
            rpm rpm2cpio libarchive-tools zstd
          # Allow Electron's user-namespace sandbox on this disposable runner.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Check Windows filesystem and renderer regressions early
        if: runner.os == 'Windows'
        run: |
          pnpm exec vitest run \
            tools/package-runtime-archive.test.mjs \
            tools/renderer-state-history-migration.test.mjs \
            tools/renderer-vendor-graph.test.mjs \
            apps/desktop/src/main/model-usage-store.test.ts \
            apps/desktop/src/renderer/src/components/ConversationMessageItem.errors.test.ts \
            apps/desktop/src/utilities/file-read-permissions.test.ts \
            apps/desktop/src/utilities/long-project-catalog.no-follow.test.ts \
            apps/desktop/src/utilities/long-project-catalog.test.ts \
            apps/desktop/src/utilities/storage-migration.test.ts \
            apps/desktop/src/utilities/material-query-service.test.ts \
            apps/desktop/src/utilities/project-transaction/lock.windows.test.ts \
            apps/desktop/src/utilities/project-transaction.test.ts \
            apps/desktop/src/utilities/conversation-storage/legacy-replay-recovery.test.ts \
            apps/desktop/src/utilities/conversation-storage/legacy-migration-relocation.test.ts \
            apps/desktop/src/utilities/book-identity/commands.test.ts \
            apps/desktop/src/utilities/long-workspace-service.chapter-binding.test.ts \
            apps/desktop/src/utilities/long-continuation-import.test.ts \
            apps/desktop/src/utilities/long-project-store.*.test.ts \
            apps/desktop/src/utilities/folder-catalog-store.migration-and-projects.test.ts \
            apps/desktop/src/utilities/conversation-exit.test.mjs \
            apps/desktop/src/utilities/conversation-history-reader.integration.test.mjs \
            apps/desktop/src/utilities/conversation-history-writer.integration.test.mjs \
            apps/desktop/src/utilities/conversation-storage/database.test.ts \
            apps/desktop/src/utilities/conversation-storage/capacity.test.ts

      - name: Build and verify Linux installers
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run --auto-servernum pnpm ${{ matrix.script }}

      - name: Build and verify native installers
        if: runner.os != 'Linux'
        run: pnpm ${{ matrix.script }}

      - name: Check macOS ZIP integrity
        if: runner.os == 'macOS'
        run: |
          for archive in apps/desktop/release/DeepWrite-*-mac-*-test.zip; do
            unzip -t "$archive"
          done

      - name: Keep verified platform installers
        uses: actions/upload-artifact@v6
        with:
          name: installers-${{ matrix.id }}
          path: |
            apps/desktop/release/DeepWrite-*
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  upload:
    name: Publish verified release installers
    needs: [prepare, package]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.package.result == 'success' || (needs.prepare.outputs.reuse_run_id != '' && needs.package.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_BUILD_RUN: ${{ needs.prepare.outputs.reuse_run_id }}
    steps:
      - name: Check out publication tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.reuse_run_id && github.sha || needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          cache: true
          cache_dependency_path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml

      - name: Install release tooling without native install scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download platform artifacts into separate directories
        uses: actions/download-artifact@v7
        with:
          pattern: installers-*
          path: release-input
          merge-multiple: false
          run-id: ${{ needs.prepare.outputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Verify checksums and merge macOS update manifests
        run: |
          node --input-type=module <<'NODE'
          import { prepareReleaseAssets } from './tools/prepare-release-assets.mjs';
          const files = await prepareReleaseAssets(
            'release-input', 'release-upload', process.env.RELEASE_TAG.slice(1)
          );
          console.log(`RELEASE_ASSETS_OK count=${files.length}`);
          NODE

      - name: Upload to draft and publish verified installers
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { publishTagRelease } = await import(pathToFileURL(path.resolve('tools/publish-release-assets.mjs')).href);
            const url = await publishTagRelease({
              github, repo: context.repo, tag: process.env.RELEASE_TAG,
              commit: process.env.RELEASE_COMMIT,
              runId: process.env.RELEASE_BUILD_RUN || context.runId,
              directory: path.resolve('release-upload')
            });
            await core.summary.addLink('Download release installers', url).write();
