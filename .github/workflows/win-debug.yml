name: Windows test debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Reproduce collection failure
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Preserve LF source files
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run failing suites with full stacks
        run: pnpm exec vitest run --reporter=basic apps/desktop/src/renderer/src/components/LibraryGroupActionMenu.test.ts apps/desktop/src/utilities/conversation-exit.test.mjs
