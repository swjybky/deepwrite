packages:
  - apps/*
  - packages/*

catalog:
  "@earendil-works/pi-agent-core": "1.1.0"
  "@earendil-works/pi-ai": "1.1.0"
  "@eslint/js": "10.0.1"
  "@modelcontextprotocol/sdk": "1.32.2"
  "@types/markdown-it": "14.2.0"
  "@types/node": "26.0.1"
  "@vitejs/plugin-vue": "6.0.7"
  "@vue/tsconfig": "0.9.1"
  electron: "42.5.0"
  electron-builder: "26.15.3"
  electron-updater: "6.6.2"
  electron-vite: "5.0.0"
  eslint: "10.8.1"
  eslint-config-prettier: "10.1.8"
  eslint-plugin-vue: "10.10.0"
  globals: "17.11.0"
  markdown-it: "14.3.3"
  naive-ui: "2.44.1"
  pdfjs-dist: "6.1.200"
  pinia: "3.0.4"
  prettier: "3.9.6"
  prosemirror-commands: "1.7.2"
  prosemirror-inputrules: "1.5.1"
  prosemirror-keymap: "1.2.3"
  prosemirror-markdown: "1.13.9"
  prosemirror-model: "1.25.13"
  prosemirror-schema-list: "1.6.0"
  prosemirror-state: "1.4.4"
  prosemirror-tables: "1.8.5"
  prosemirror-view: "1.42.9"
  typebox: "1.3.27"
  typescript: "6.0.3"
  typescript-eslint: "8.67.0"
  vite: "8.1.0"
  vitest: "4.1.9"
  vue: "3.5.39"
  vue-i18n: 11.4.12
  vue-tsc: "3.3.5"
  zod: "4.4.3"

allowBuilds:
  electron: true
  esbuild: true
  electron-winstaller: false
  # Slice 2 only uses Pi's local Faux provider; these transitive provider
  # packages do not need install scripts for the desktop runtime.
  "@google/genai": false
  protobufjs: false

minimumReleaseAgeExclude:
  - "@earendil-works/pi-agent-core@1.1.0"
  - "@earendil-works/pi-ai@1.1.0"
  - "@earendil-works/pi-telemetry@1.1.0"
